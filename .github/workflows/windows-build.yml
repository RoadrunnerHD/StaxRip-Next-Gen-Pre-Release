name: StaxRip Next Gen Pre-Release Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Build FrameServer and publish with bundled .NET 10 runtime
        shell: pwsh
        run: ./Build-NG.ps1
      - name: Upload complete self-contained build outputs for testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: StaxRip-Next-Gen-Pre-Release-build-outputs
          path: Source/publish-net10/**
          if-no-files-found: error
